name: CI

# Safety gate: every push and PR must typecheck, test, and build before it can
# be relied on. Vercel deploys from main, so a red run here is the signal to
# fix before it reaches production.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Backend tests are integration tests against a real Postgres, so spin up a
    # throwaway one and point DATABASE_URL at it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      NODE_ENV: test
      # admin.test.ts asserts this exact email auto-provisions as admin; the
      # app reads the designated admins from ADMIN_EMAILS. Not a secret.
      ADMIN_EMAILS: pravendalal@gmail.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Uses the repo's own orchestration: typecheck:libs runs `tsc --build`
      # over every composite lib (db, api-zod, api-client-react, etc.), then
      # each app is typechecked. This is what emits the .d.ts the API depends on.
      - name: Typecheck (libs + apps)
        run: pnpm run typecheck

      - name: Create schema in test database
        run: pnpm --filter @workspace/db run push-force

      - name: Test API
        run: pnpm --filter @workspace/api-server run test

      - name: Build web app
        run: pnpm --filter @workspace/dempo run build

      - name: Build API bundle
        run: pnpm --filter @workspace/api-server run build
