name: CI

# Safety gate: every push and PR must typecheck, test, and build before it can
# be relied on. Vercel deploys from main, so a red run here is the signal to
# fix before it reaches production.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Backend tests are integration tests against a real Postgres, so spin up a
    # throwaway one and point DATABASE_URL at it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared db types
        run: pnpm exec tsc -b --force lib/db/tsconfig.json

      - name: Create schema in test database
        run: pnpm --filter @workspace/db run push-force

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Test API
        run: pnpm --filter @workspace/api-server run test

      - name: Typecheck web app
        run: pnpm --filter @workspace/dempo run typecheck

      - name: Build web app
        run: pnpm --filter @workspace/dempo run build

      - name: Build API bundle
        run: pnpm --filter @workspace/api-server run build
